<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
  <div class="notif-head">
    <h2>Notifications</h2>
    <div class="actions">
      <form th:action="@{/notifications/read-all}" method="post">
        <button class="btn btn-sm btn-outline" type="submit">Mark all as read</button>
      </form>
      <form sec:authorize="hasRole('OWNER')" th:action="@{/owner/notifications/check}" method="post">
        <button class="btn btn-sm" type="submit">Run expiry check now</button>
      </form>
    </div>
  </div>

  <div class="notif-list">
    <div th:each="n : ${items}"
         th:class="'notif ' + ${n.severity} + (${n.seen} ? '' : ' unread')">
      <div th:text="${n.message}"></div>
      <div class="time" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}"></div>
    </div>
    <p th:if="${#lists.isEmpty(items)}" style="color:var(--muted)">Abhi koi notification nahi hai</p>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
