<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add Member')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
  <div class="card wide">
    <h2>Add New Member</h2>

    <form id="memberForm" th:action="@{/owner/members/add}" method="post" enctype="multipart/form-data">
      <label>Full Name</label>
      <input type="text" name="fullName" required>

      <label>Mobile Number</label>
      <input type="tel" name="mobile" required>

      <label>Email (optional)</label>
      <input type="email" name="email">

      <label>Date of Birth</label>
      <input type="date" name="dob">

      <label>Gender</label>
      <select name="gender">
        <option>Male</option><option>Female</option><option>Other</option>
      </select>

      <label>Membership Plan</label>
      <select name="planId" id="plan" required>
        <option th:each="p : ${plans}"
                th:value="${p.id}"
                th:attr="data-months=${p.months}"
                th:text="${p.name} + ' - ₹' + ${p.price}"></option>
      </select>

      <label>Start Date</label>
      <input type="date" name="startDate" id="startDate" required>

      <label>Expiry Date (auto)</label>
      <input type="date" id="expiryDate" readonly>

      <label>Amount Paid</label>
      <input type="number" name="amount" min="0" required>

      <label>Payment Method</label>
      <select name="paymentMethod" id="paymentMethod">
        <option>Cash</option>
        <option>UPI</option>
        <option>Card</option>
        <option>Bank Transfer</option>
      </select>

      <div id="qrBox" style="display:none; text-align:center; margin:16px 0">
        <img th:src="@{/images/payment-qr.png}" alt="Scan to pay"
             style="width:220px; background:#fff; padding:8px; border-radius:12px;">
        <p style="color:var(--muted); font-size:.9rem">Scan karke payment karein, phir Transaction ID daalein</p>
      </div>

      <label>Transaction ID (optional)</label>
      <input type="text" name="transactionId" maxlength="60">

      <label>Member Login Password</label>
      <input type="password" name="password"
