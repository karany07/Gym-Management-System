<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change Password')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
  <div class="card wide">
    <h2>Change Password</h2>

    <form th:action="@{/account/password}" method="post">
      <label>Current Password</label>
      <input type="password" name="currentPassword" required>

      <label>New Password (Greater Than 8 Character)</label>
      <input type="password" name="newPassword" minlength="8" maxlength="72" required>

      <label>Re-enter New Password</label>
      <input type="password" name="confirmPassword" minlength="8" maxlength="72" required>

      <button class="btn" type="submit">Change Password</button>
    </form>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
