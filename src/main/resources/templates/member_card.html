<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Member Card')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div th:replace="~{fragments :: flash}"></div>

<div class="container">
  <div class="id-card">

    <div class="id-head">
      <div class="logo">⚡</div>
      <div>
        <div class="gym-name" th:text="${gymName}">FitZone Gym</div>
        <div class="gym-tag">MEMBER CARD</div>
      </div>
    </div>

    <div class="id-body">
      <div class="id-photo">
        <img th:if="${member.photo != null}" th:src="@{/uploads/{f}(f=${member.photo})}" alt="Member photo">
        <div class="no-photo" th:if="${member.photo == null}"
             th:text="${#strings.toUpperCase(#strings.substring(member.user.name, 0, 1))}">A</div>
      </div>

      <div class="id-info">
        <h3 th:text="${member.user.name}">Name</h3>
        <p><b>ID:</b> <span th:text="${member.user.memberCode}"></span></p>
        <p><b>Phone:</b> <span th:text="${member.user.mobile}"></span></p>
        <p><b>Plan:</b> <span th:text="${member.plan.name}"></span></p>
        <p><b>Joined:</b> <span th:text="${#temporals.format(joinDate, 'dd MMM yyyy')}"></span></p>
        <p><b>Expiry:</b> <span th:text="${#temporals.format(member.expiryDate, 'dd MMM yyyy')}"></span>
           <span th:class="'status status-' + ${member.status}"
                 th:text="${#strings.capitalize(member.status)}"></span></p>
      </div>

      <div class="id-qr" th:utext="${qrSvg}"></div>
    </div>

    <div class="id-foot">
      <span th:text="'📞 ' + ${gymPhone}"></span>
      <span th:text="${gymAddress}"></span>
    </div>
  </div>

  <div class="card-actions no-print">
    <button class="btn" type="button" onclick="window.print()">Print / Download PDF</button>
    <a class="btn btn-outline" th:href="@{${backUrl}}">Back</a>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
