spring.application.name=gym

# Database (abhi H2 file database, baad me MySQL)
spring.datasource.url=jdbc:h2:file:./data/gymdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console live pe band (BADLA)
spring.h2.console.enabled=false

# Render apna port deta hai (NAYA)
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# photo upload
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
gym.upload-dir=uploads

spring.thymeleaf.cache=true

# owner account
gym.owner.email=owner@fitzone.com
gym.owner.password=${OWNER_PASSWORD}

# Gym ki details. Apni asli details daalo
gym.name=FitZone Gym
gym.phone=+91 8707237880
gym.address=Gym ka address yahan likho

# QR code ka link. Live pe Render ka URL aayega, local pe localhost (BADLA)
gym.base-url=${BASE_URL:http://localhost:8080}

gym.owner.reset-on-start=false

# Security hardening
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Local pe false, live pe Render env se true (BADLA)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-stacktrace=never
server.error.include-message=never