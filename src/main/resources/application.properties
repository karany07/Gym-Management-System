spring.application.name=gym
# Database (abhi H2 file database, baad me Mysql)
spring.datasource.url=jdbc:h2:file:./data/gymdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#photo upload

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
gym.upload-dir=uploads

spring.thymeleaf.cache=false

#phle owner account (logon ke bad password badal lena )
   gym.owner.email=owner@fitzone.com
   gym.owner.password=ChangeMe@123

   # Gym ki details (member card par dikhti hain). Apni asli details daal do.
gym.name=FitZone Gym
gym.phone=+91 00000 00000
gym.address=Gym ka address yahan likho

# QR code me ye link jayega. Phone se scan karna ho to localhost ki jagah
# apne computer ka IP likho (jaise http://192.168.1.5:8080)
gym.base-url=http://localhost:8080

# Owner reset (password bhool jao to sirf ek baar true karo)
gym.owner.reset-on-start=false

# Security hardening
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
server.error.include-message=never
# HTTPS lagne ke baad (live site par) ye line bhi jodna:
# server.servlet.session.cookie.secure=true
